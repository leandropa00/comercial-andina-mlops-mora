name: CI - Comercial Andina
on: [push, pull_request]
permissions:
  contents: read
  statuses: write
jobs:
  mlops:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
    steps:
      - name: 'notify vercel'
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: 'vercel/repository-dispatch/actions/status@v1'
        with:
          name: 'Vercel - comercial-andina-mlops-mora: Vercel updates'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias versionadas
        run: python -m pip install -r requirements.txt
      - name: Validar dataset sintético
        run: python validar_datos.py
      - name: Ejecutar cuatro variantes y puerta de calidad
        run: python entrenar.py
      - name: Verificar artefactos de modelos aprobados en MLflow
        run: |
          python - <<'PYCODE'
          from mlflow import MlflowClient
          c = MlflowClient(tracking_uri='sqlite:///mlflow.db')
          exp = c.get_experiment_by_name('comercial-andina-mora-sintetica')
          assert exp is not None
          runs = c.search_runs([exp.experiment_id])
          assert len(runs)==4, len(runs)
          approved = [r for r in runs if r.data.tags.get('puerta')=='aprobado']
          rejected = [r for r in runs if r.data.tags.get('puerta')=='rechazado']
          assert approved and rejected
          for r in approved:
              assert any(a.path.endswith('.joblib') for a in c.list_artifacts(r.info.run_id,'modelos'))
          for r in rejected:
              assert not c.list_artifacts(r.info.run_id,'modelos')
          print('MLflow: cuatro runs y modelos de candidatos aprobados verificados')
          PYCODE
      - name: Ejecutar pruebas automáticas
        run: python -m pytest -q pruebas
      - name: Demostrar fallo intencional de Pytest al quitar validación
        run: |
          cp app.py /tmp/app_original.py
          python - <<'PYCODE'
          from pathlib import Path
          path = Path('app.py')
          text = path.read_text()
          target = 'uso_cupo_pct: float = Field(ge=0,le=100)'
          assert target in text
          path.write_text(text.replace(target, 'uso_cupo_pct: float = Field(ge=0)'))
          PYCODE
          set +e
          python -m pytest -q pruebas/test_app.py > /tmp/pytest_falla_deliberada.txt 2>&1
          status=$?
          set -e
          cp /tmp/app_original.py app.py
          cat /tmp/pytest_falla_deliberada.txt
          if [ "$status" -eq 0 ]; then
            echo 'ERROR: Pytest no detectó la validación retirada'
            exit 1
          fi
          grep -q 'FAILED' /tmp/pytest_falla_deliberada.txt
          echo 'Validación restaurada; fallo deliberado confirmado.'
      - name: Evidenciar rechazo de un modelo deficiente
        run: |
          if python entrenar.py --modelo baseline --salida /tmp/rechazado; then
            echo 'ERROR: se aceptó un modelo rechazado'
            exit 1
          fi
          test ! -f /tmp/rechazado/modelo.joblib
      - name: Construir contenedor y comprobar salud
        run: |
          docker build -t comercial-andina-mora .
          docker run -d --name mora-api -p 8000:8000 comercial-andina-mora
          for i in $(seq 1 25); do
            if curl -fsS http://localhost:8000/salud; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/salud
          docker rm -f mora-api
      - name: Simular deriva y comprobar alerta KS
        run: |
          python simular_produccion.py
          if python monitoreo.py --reciente datos/produccion_deriva.csv > monitoreo_resultado.txt; then
            echo 'ERROR: el monitor no detectó deriva'
            exit 1
          fi
          grep '"deriva": true' monitoreo_resultado.txt
      - name: Guardar evidencias del pipeline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-mlops-mora
          if-no-files-found: warn
          path: |
            modelos/experimentos.csv
            modelos/experimentos.json
            mlflow.db
            monitoreo_resultado.txt
            /tmp/pytest_falla_deliberada.txt
